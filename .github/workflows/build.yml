name: Build

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnose staged source chunks
        run: |
          wc -c .chatgpt-source/source-full-*
          sha256sum .chatgpt-source/source-full-*
          exit 1
