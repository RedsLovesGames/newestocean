name: Build patched Newestocean

on:
  push:
    branches:
      - 'feature/chatgpt-physics-fix-build'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Reconstruct patched source
        shell: bash
        run: |
          cat .ci/source-*.b64 | base64 --decode > /tmp/newestocean-changed.tgz
          echo 'c56f73b4e23736949c290c5bb2b60c79814336fffd44fa3d7b188e15074e5a23  /tmp/newestocean-changed.tgz' | sha256sum -c -
          tar -xzf /tmp/newestocean-changed.tgz -C .
          base64 --decode .ci/current-missing.b64 > /tmp/newestocean-current-missing.tgz
          echo 'a0f2df07862b06ca6410606f5d62d2e57da4a9470accb6faa7f7655b3bc92fb4  /tmp/newestocean-current-missing.tgz' | sha256sum -c -
          tar -xzf /tmp/newestocean-current-missing.tgz -C .

      - name: Build and test
        run: gradle build --stacktrace

      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: newestocean-physics-fix
          path: build/libs/*.jar
          if-no-files-found: error
